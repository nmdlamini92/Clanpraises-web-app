#version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: dockerfile.backend
    container_name: bantu-backend
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    networks:
      - bantu-network
    extra_hosts:
    - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: dockerfile.frontend
    container_name: bantu-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - bantu-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  bantu-network:
    driver: bridge


